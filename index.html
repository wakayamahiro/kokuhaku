<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#0e1018;--panel:#171a26;--panel2:#202435;--line:#30364a;--text:#f5f6fb;--muted:#aeb5c8;--pink:#ff6fae;--purple:#9b8cff;--gold:#ffd166;--ok:#62d49b;--danger:#ff687d;--shadow:0 14px 40px rgba(0,0,0,.28)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#292039 0,#0e1018 42%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;min-height:100vh}button,input{font:inherit}.app{max-width:1080px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.title{font-size:28px;font-weight:900;letter-spacing:.03em}.subtitle{color:var(--muted);font-size:13px}.card{background:rgba(23,26,38,.94);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}.center{text-align:center}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}.btn{border:1px solid var(--line);background:#24293a;color:var(--text);border-radius:12px;padding:11px 15px;cursor:pointer;transition:.15s}.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}.btn.primary{background:linear-gradient(135deg,#ff5fa5,#9b76ff);border:0;font-weight:800}.btn.ok{background:#193d31;border-color:#2d765b}.btn.danger{background:#4a2029;border-color:#783541}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}.block{width:100%}input{width:100%;background:#0f1220;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px 12px;outline:none}input:focus{border-color:var(--purple)}label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#111521;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:20px}.small{font-size:13px}.muted{color:var(--muted)}.hidden{display:none!important}.room{font-size:34px;font-weight:900;letter-spacing:.18em;color:var(--gold);padding:8px}.seats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.seat{padding:10px 12px;background:#111521;border:1px solid var(--line);border-radius:10px}.seat.me{border-color:var(--pink)}.phase{display:inline-flex;padding:5px 9px;border-radius:999px;background:#2a2035;color:#f2b7ff;font-size:12px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.date{min-height:205px;background:linear-gradient(160deg,#23283a,#151824);border:1px solid var(--line);border-radius:15px;padding:13px;position:relative;cursor:pointer}.date.selected{border:2px solid var(--pink);box-shadow:0 0 0 3px rgba(255,111,174,.12)}.date.used{opacity:.35;cursor:not-allowed}.date .icon{font-size:38px}.date .name{font-size:17px;font-weight:800;margin-top:6px}.pill{display:inline-block;padding:4px 7px;border-radius:999px;background:#30364b;font-size:11px;margin:4px 3px 0 0}.value{font-size:20px;font-weight:900;color:var(--gold);margin-top:6px}.topic{margin-top:10px;color:#d6dbee;font-size:12px}.women{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.woman{padding:14px;border:1px solid var(--line);border-radius:13px;background:#111521}.woman.selected{border-color:var(--pink);background:#271a29}.notice{padding:12px;border-radius:12px;background:#111521;border:1px solid var(--line)}.log{max-height:180px;overflow:auto;font-size:12px;color:var(--muted);line-height:1.7}.big{font-size:42px;font-weight:900}.beauty{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.beauty .card{margin:0;text-align:center}.win{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,209,102,.15),var(--shadow)}.result-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.rank{font-size:18px;font-weight:900}.footer{color:var(--muted);font-size:11px;text-align:center;padding:20px}.error{color:#ff9aa8;margin-top:8px}
@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.grid,.beauty{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.seats,.women{grid-template-columns:1fr 1fr}}@media(max-width:520px){.app{padding:12px}.cards{grid-template-columns:1fr}.grid,.beauty,.seats,.women,.result-grid{grid-template-columns:1fr}.title{font-size:22px}}
</style>
</head>
<body>
<div class="app"><div class="top"><div><div class="title">💘 告白タイミング</div><div class="subtitle">デートを選び、会話で運命を動かせ。</div></div><div id="connection" class="small muted"></div></div><main id="root"></main><div class="footer">Firebase Firestoreによるオンライン同期対応</div></div>
<script>
// ============================================================
// Firebase：既存ゲームのオンライン機能を継承
// ============================================================
const firebaseConfig={apiKey:"AIzaSyCHiPbAERMR--X8C_jfu-S9ALETc0DmybU",authDomain:"sea-solt2.firebaseapp.com",projectId:"sea-solt2",storageBucket:"sea-solt2.firebasestorage.app",messagingSenderId:"267993560136",appId:"1:267993560136:web:c1f2a8d75a7b22baf6d47d",measurementId:"G-1MDDE3GN49"};
let db=null,fbReady=false;try{firebase.initializeApp(firebaseConfig);db=firebase.firestore();fbReady=true}catch(e){console.error(e)}
const ROOM_COLLECTION='confession_timing_rooms';
const App={uid:'u_'+Math.random().toString(36).slice(2,10),name:'',roomCode:null,seat:-1,unsub:null,doc:null,local:null};
const root=document.getElementById('root');
const STAT={affection:{label:'💗 好感度',short:'好感度'},tension:{label:'😳 緊張度',short:'緊張度'},expense:{label:'💰 出費',short:'出費'},romantic:{label:'🌙 ロマンチック度',short:'ロマンチック度'}};
const TIMES=[['☀️','昼'],['🌆','夕方'],['🌙','夜']];
const PLACES=[
 ['☕','カフェ'],['🎬','映画館'],['🎢','遊園地'],['🐠','水族館'],['🌃','展望台'],['🍽️','高級レストラン'],['🛍️','ショッピング'],['🌳','公園'],['🎤','カラオケ'],['🎨','美術館'],['🏖️','海'],['🦁','動物園'],['🎳','ボウリング'],['🕹️','ゲームセンター'],['♨️','温泉'],['⛩️','神社'],['🔭','プラネタリウム'],['🚗','ドライブ'],['🌆','夜の街'],['🏨','ホテルラウンジ'],['🍰','スイーツ店'],['🎡','観覧車'],['🌹','庭園'],['📚','本屋']
];
const TOPICS=['好きな食べ物','最近観た映画','音楽','旅行','動物','仕事','学生時代','趣味','休日の過ごし方','恋愛観','子どもの頃','最近ハマっていること','行ってみたい場所','好きな季節','理想のデート','秘密','苦手なこと','最近あった面白い話','朝型？夜型？','もし1週間休みがあったら？'];
const BEAUTIES=[{id:'affection',name:'💗 好感度の爆美女',desc:'一緒にいると自然と惹かれるタイプ'},{id:'tension',name:'😳 緊張度の爆美女',desc:'ドキドキさせられる相手に弱いタイプ'},{id:'expense',name:'💰 出費の爆美女',desc:'最高のデートをしてくれる相手に弱いタイプ'},{id:'romantic',name:'🌙 ロマンチック度の爆美女',desc:'雰囲気とムードを大切にするタイプ'}];
function el(h){const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function code(){return Array.from({length:5},()=>rnd('ABCDEFGHJKLMNPQRSTUVWXYZ23456789'.split(''))).join('')}
function emptyStats(){return {affection:0,tension:0,expense:0,romantic:0}}
function makeCards(n=5){return shuffle(PLACES).slice(0,n).map((p,i)=>{const st=rnd(Object.keys(STAT));const tm=rnd(TIMES);return{id:'d_'+Date.now().toString(36)+'_'+i+'_'+Math.random().toString(36).slice(2,6),place:p[1],icon:p[0],status:st,value:1+Math.floor(Math.random()*3),time:tm[1],timeIcon:tm[0],topic:rnd(TOPICS)}})}
function initialState(names,totalRounds=8){return{players:names.map((name,i)=>({id:i,name,stats:emptyStats(),initialStats:emptyStats(),score:0,beauties:[],selectedCard:null})),totalRounds,round:1,parent:0,phase:'initial_setup',fieldCards:[],selected:{},assignments:{},assignmentDone:{},logs:['ゲーム開始'],beauties:BEAUTIES,result:null}}
function log(s,x){s.logs=(s.logs||[]).concat(x).slice(-80)}
function addStats(p,st,v){p.stats[st]+=v}
function newRound(s){s.fieldCards=makeCards();s.selected={};s.assignments={};s.assignmentDone={};s.players.forEach(p=>p.selectedCard=null);s.phase='parent_select';log(s,`第${s.round}ラウンド開始。`);return s}
function allSelected(s){return s.players.every(p=>s.selected[p.id]!=null)}
function usedIds(s){return Object.values(s.selected).filter(Boolean)}
function applyRoundResult(s){
 const counts={};s.fieldCards.forEach(c=>counts[c.id]=0);Object.values(s.assignments).forEach(cid=>{if(counts[cid]!=null)counts[cid]++});
 const parentCardId=s.selected[s.parent];const parentCard=s.fieldCards.find(c=>c.id===parentCardId);
 s.players.forEach(p=>{
   const cid=s.selected[p.id];const c=s.fieldCards.find(x=>x.id===cid);if(!c)return;
   const women=counts[c.id]||0;
   // 親：親＋女性1人だけなら2倍
   if(p.id===s.parent && women===1){addStats(p,c.status,c.value*2);log(s,`${p.name}が${c.place}で2人きり。${STAT[c.status].short}+${c.value*2}`)}
   // 子：子＋女性1人だけなら1倍。親が選んだカードでも、親以外の子がそのカードを選べないためここには来ない。
   else if(p.id!==s.parent && women===1){addStats(p,c.status,c.value);log(s,`${p.name}が${c.place}で2人きり。${STAT[c.status].short}+${c.value}`)}
   else log(s,`${p.name}の${c.place}は2人きり成立せず。`);
 });
 if(s.round>=s.totalRounds){s.phase='confession';log(s,'最終ラウンド終了。告白タイムへ。');return s}
 s.round++;s.parent=(s.parent+1)%s.players.length;return newRound(s)
}
function setInitial(s,pid,stats){if(Object.values(stats).reduce((a,b)=>a+b,0)!==4)return s;s.players[pid].initialStats={...stats};s.players[pid].stats={...stats};return s}

// ============================================================
// ルーム作成・参加・同期：既存コードと同じFirestore方式
// ============================================================
function subscribe(codeValue){if(App.unsub)App.unsub();const ref=db.collection(ROOM_COLLECTION).doc(codeValue);App.unsub=ref.onSnapshot(snap=>{if(!snap.exists){showError('ルームが存在しません。');return}App.doc=snap.data();App.seat=(App.doc.seats||[]).findIndex(x=>x&&x.uid===App.uid);renderOnline();},e=>{console.error(e);showError('通信エラー：'+e.message)})}
async function createRoom(){App.name=(document.getElementById('name')?.value||'あなた').trim()||'あなた';let c;for(let i=0;i<8;i++){const x=code();const ref=db.collection(ROOM_COLLECTION).doc(x);try{await db.runTransaction(async tx=>{if((await tx.get(ref)).exists)throw Error('exists');tx.set(ref,{status:'waiting',createdAt:firebase.firestore.FieldValue.serverTimestamp(),seats:[{uid:App.uid,name:App.name},null,null,null,null,null],settings:{rounds:8},game:null})});c=x;break}catch(e){if(e.message!=='exists')throw e}}if(!c)throw Error('ルームコードを作成できませんでした');App.roomCode=c;subscribe(c)}
async function joinRoom(c){App.name=(document.getElementById('name')?.value||'あなた').trim()||'あなた';c=c.trim().toUpperCase();const ref=db.collection(ROOM_COLLECTION).doc(c);await db.runTransaction(async tx=>{const snap=await tx.get(ref);if(!snap.exists)throw Error('ルームが見つかりません');const d=snap.data();if(d.status!=='waiting')throw Error('ゲームはすでに開始されています');const seats=(d.seats||[]).slice();if(seats.some(x=>x&&x.uid===App.uid)){}else{const i=seats.findIndex(x=>!x);if(i<0)throw Error('満席です');seats[i]={uid:App.uid,name:App.name}}tx.update(ref,{seats})});App.roomCode=c;subscribe(c)}
async function txGame(mutator){const ref=db.collection(ROOM_COLLECTION).doc(App.roomCode);await db.runTransaction(async tx=>{const snap=await tx.get(ref);const d=snap.data();if(d.status!=='playing')return;const before=JSON.parse(JSON.stringify(d.game));const after=mutator(before);tx.update(ref,{game:after})})}
async function startGame(){const ref=db.collection(ROOM_COLLECTION).doc(App.roomCode);await db.runTransaction(async tx=>{const snap=await tx.get(ref),d=snap.data();if(d.status!=='waiting')return;if(d.seats.filter(Boolean).length<2)throw Error('2人以上必要です');const names=d.seats.filter(Boolean).map(x=>x.name);let s=initialState(names,8);s.phase='initial_setup';tx.update(ref,{status:'playing',game:s})})}
function disconnect(){if(App.unsub){App.unsub();App.unsub=null}App.doc=null;App.roomCode=null;App.seat=-1}

// ============================================================
// 画面
// ============================================================
function renderStart(){root.innerHTML=`<div class="card center"><div class="big">💘</div><h1>告白タイミング</h1><p class="muted">デート場所を選び、会話で1人を呼び込み、最後に爆美女を仕留める心理戦。</p><div class="grid" style="margin-top:18px"><button class="btn primary block" id="online">オンライン対戦</button><button class="btn block" id="local">同じ端末で遊ぶ</button><button class="btn block" id="rules">ルールを見る</button><button class="btn block" id="reset">画面を更新</button></div><div id="rulebox" class="notice hidden" style="margin-top:14px;text-align:left"><b>基本ルール</b><br>4つのステータスは 💗好感度 / 😳緊張度 / 💰出費 / 🌙ロマンチック度。開始時に4ポイントを自由配分。毎ラウンド5枚のデートカードから親が1枚、子が順番に1枚選ぶ。会話後、女性を配置し、親＋女性1人ならカード値×2、子＋女性1人なら×1。ゲーム中の他人のステータスは非公開。最終告白タイムで公開し、4種類の爆美女を各ステータス1位が獲得。1人1点。</div></div>`;document.getElementById('online').onclick=renderEntry;document.getElementById('local').onclick=renderLocalSetup;document.getElementById('rules').onclick=()=>document.getElementById('rulebox').classList.toggle('hidden');document.getElementById('reset').onclick=()=>location.reload()}
function renderEntry(){root.innerHTML=`<div class="card"><h2>オンライン対戦</h2><label>プレイヤー名</label><input id="name" maxlength="12" placeholder="あなた"><div class="row" style="margin-top:14px"><button class="btn primary grow" id="create">ルームを作成</button></div><div class="section-label" style="margin:18px 0 6px">ルームに参加</div><div class="row"><input id="code" maxlength="5" placeholder="5文字のルームコード"><button class="btn ok" id="join">参加</button></div><div id="err" class="error"></div><button class="btn block" id="back" style="margin-top:14px">戻る</button></div>`;document.getElementById('back').onclick=renderStart;document.getElementById('create').onclick=async()=>{try{await createRoom()}catch(e){document.getElementById('err').textContent=e.message}};document.getElementById('join').onclick=async()=>{try{App.name=(document.getElementById('name').value||'あなた').trim()||'あなた';await joinRoom(document.getElementById('code').value)}catch(e){document.getElementById('err').textContent=e.message}}}
function renderLobby(){const d=App.doc,filled=d.seats.filter(Boolean).length,host=d.seats[0]?.uid===App.uid;root.innerHTML=`<div class="card center"><h2>ルーム待機中</h2><div class="room">${App.roomCode}</div><p class="muted">このコードを友達に共有してください。</p><div class="seats">${d.seats.map((s,i)=>`<div class="seat ${s?.uid===App.uid?'me':''}">${s?esc(s.name)+(s.uid===App.uid?'（あなた）':''):'空席'}<br><span class="muted small">席${i+1}</span></div>`).join('')}</div><div class="notice" style="margin-top:14px">${filled}/6人参加</div>${host?`<button class="btn primary block" id="start" style="margin-top:14px" ${filled<2?'disabled':''}>ゲーム開始</button>`:`<p class="muted">ホストがゲームを開始するまでお待ちください。</p>`}<button class="btn block" id="leave" style="margin-top:8px">退出</button></div>`;if(host)document.getElementById('start').onclick=async()=>{try{await startGame()}catch(e){alert(e.message)}};document.getElementById('leave').onclick=()=>{disconnect();renderStart()}}
function statusOwn(p){return `<div class="stats">${Object.entries(STAT).map(([k,v])=>`<div class="stat"><span>${v.label}</span><b>${p.stats[k]}</b></div>`).join('')}</div>`}
function renderInitial(s,online=true){const p=s.players[App.seat>=0?App.seat:0];if(!p)return;const sum=Object.values(p.initialStats).reduce((a,b)=>a+b,0);root.innerHTML=`<div class="card"><div class="phase">ゲーム準備</div><h2>初期ステータスを振り分け</h2><p class="muted">4ポイントを4つの告白スキルに自由に配分してください。0ポイントも可能。数字は他プレイヤーには非公開です。</p><div id="alloc"></div><div class="notice" style="margin-top:12px">残りポイント：<b id="remain">${4-sum}</b></div><button class="btn primary block" id="confirm" ${sum!==4?'disabled':''} style="margin-top:12px">この配分で確定</button><p class="small muted center" style="margin-top:10px">全員の確定を待っています…</p></div>`;const box=document.getElementById('alloc');Object.entries(STAT).forEach(([k,v])=>{const r=el(`<div class="row" style="justify-content:space-between;margin:9px 0"><b>${v.label}</b><div class="row"><button class="btn" data-minus="${k}">−</button><b style="width:30px;text-align:center" id="n-${k}">${p.initialStats[k]}</b><button class="btn" data-plus="${k}">＋</button></div></div>`);box.appendChild(r)});function rerender(){const q=s.players[App.seat>=0?App.seat:0].initialStats;const n=Object.values(q).reduce((a,b)=>a+b,0);document.getElementById('remain').textContent=4-n;document.getElementById('confirm').disabled=n!==4;Object.keys(q).forEach(k=>document.getElementById('n-'+k).textContent=q[k])}box.querySelectorAll('[data-plus]').forEach(b=>b.onclick=async()=>{const k=b.dataset.plus;const q=s.players[App.seat].initialStats;const n=Object.values(q).reduce((a,x)=>a+x,0);if(n<4){q[k]++;await syncSetInitial(q);rerender()}});box.querySelectorAll('[data-minus]').forEach(b=>b.onclick=async()=>{const k=b.dataset.minus;const q=s.players[App.seat].initialStats;if(q[k]>0){q[k]--;await syncSetInitial(q);rerender()}});document.getElementById('confirm').onclick=async()=>{await txGame(x=>{x.players[App.seat].initialConfirmed=true;x.players[App.seat].initialStats={...x.players[App.seat].initialStats};x.players[App.seat].stats={...x.players[App.seat].initialStats};if(x.players.every(p=>p.initialConfirmed)){x.round=1;x.parent=0;x.phase='parent_select';x.fieldCards=makeCards();x.logs=['全員の初期ステータス確定。第1ラウンド開始。']}return x})}}
async function syncSetInitial(q){await txGame(x=>{x.players[App.seat].initialStats={...q};return x})}
function cardHtml(c,selected=false,disabled=false){return `<div class="date ${selected?'selected':''} ${disabled?'used':''}" data-card="${c.id}"><div class="icon">${c.icon}</div><div class="name">${esc(c.place)}</div><span class="pill">${STAT[c.status].label}</span><span class="pill">${c.timeIcon}${c.time}</span><div class="value">+${c.value}</div><div class="topic">💬 ${esc(c.topic)}</div></div>`}
function renderField(s,mode='online'){const me=App.seat>=0?s.players[App.seat]:s.players[0];let selected=mode==='local'?s.selected[App.localSeat]:s.selected[App.seat];const parent=s.parent;root.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><div><span class="phase">第${s.round}/${s.totalRounds}ラウンド</span><h2 style="margin:9px 0">${s.players[parent].name} が親</h2></div><div style="min-width:260px">${statusOwn(me)}</div></div></div><div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">デート候補5枚</h2><span class="muted small">${s.phase==='parent_select'?'親が1枚選択':'子が順番に選択'}</span></div><div class="cards" style="margin-top:12px">${s.fieldCards.map(c=>cardHtml(c,selected===c.id,usedIds(s).includes(c.id))).join('')}</div><div id="hint" class="notice" style="margin-top:12px">${s.phase==='parent_select'?'親：自分が欲しいステータスのカードを選んでください。':'子：残っているカードから1枚選んでください。'}</div></div><div class="card"><h3>現在の選択状況</h3><div class="seats">${s.players.map(p=>`<div class="seat">${esc(p.name)}<br><span class="muted">${s.selected[p.id]?'選択済み':'選択待ち'}</span></div>`).join('')}</div></div><div class="card"><h3>ログ</h3><div class="log">${(s.logs||[]).slice(-10).map(x=>`・${esc(x)}`).join('<br>')}</div></div>`;root.querySelectorAll('[data-card]').forEach(node=>node.onclick=async()=>{const cid=node.dataset.card;if(usedIds(s).includes(cid))return;if(s.phase==='parent_select'&&App.seat!==parent)return;if(s.phase==='child_select'&&App.seat===parent)return;if(s.phase==='child_select'){const next=s.players.find(p=>p.id!==parent&&!s.selected[p.id]);if(!next||next.id!==App.seat)return}await txGame(x=>{x.selected[App.seat]=cid;if(x.phase==='parent_select'){x.players[App.seat].selectedCard=cid;x.phase='child_select'}else{x.players[App.seat].selectedCard=cid;if(Object.keys(x.selected).length===x.players.length){x.phase='conversation';x.logs.push('全員のデート場所が決定。会話タイムへ。')}}return x})})}
function renderConversation(s){root.innerHTML=`<div class="card center"><div class="phase">会話タイム</div><h2>💬 会話で1人だけ呼び込め</h2><p class="muted">各プレイヤーは自分の選んだデート場所と「会話のタネ」を確認。現実の会話で、どの女性がどこへ行くかを駆け引きしてください。</p><div class="notice" style="margin-top:14px">オンラインの場合はボイスチャット等を使って自由に会話してください。女性ごとの「来やすい場所」は存在しません。</div><div class="grid" style="margin-top:14px">${s.players.map(p=>{const c=s.fieldCards.find(x=>x.id===s.selected[p.id]);return `<div class="notice"><b>${esc(p.name)}</b><br>${c.icon} ${esc(c.place)}<br><span class="pill">${STAT[c.status].label} +${c.value}</span><span class="pill">${c.timeIcon}${c.time}</span><p class="small">💬 ${esc(c.topic)}</p></div>`}).join('')}</div><button class="btn primary block" id="next" style="margin-top:16px">会話終了・女性を配置する</button></div>`;document.getElementById('next').onclick=async()=>txGame(x=>{x.phase='assignment';x.assignments={};x.assignmentDone={};x.logs.push('会話終了。女性の配置へ。');return x})}
function renderAssignment(s){const me=App.seat>=0?s.players[App.seat]:s.players[0];const selected=s.selected[me.id];const cards=s.fieldCards.filter(c=>usedIds(s).includes(c.id));const done=!!s.assignmentDone[me.id];root.innerHTML=`<div class="card"><div class="phase">女性配置</div><h2>あなたのデートに来る女性を決める</h2><p class="muted">会話で決まった結果を、各プレイヤーが1人ずつ配置します。女性は1人につき1つのデート場所へ。</p><div class="women">${cards.map(c=>`<div class="woman ${s.assignments[me.id]===c.id?'selected':''}" data-cid="${c.id}"><div style="font-size:28px">${c.icon}</div><b>${esc(c.place)}</b><div class="small muted">${STAT[c.status].label} +${c.value} / ${c.timeIcon}${c.time}</div></div>`).join('')}</div><button class="btn primary block" id="done" ${done||!s.assignments[me.id]?'disabled':''} style="margin-top:14px">この女性配置を確定</button><div class="notice" style="margin-top:10px">確定済み：${Object.keys(s.assignmentDone).length}/${s.players.length}</div></div>`;root.querySelectorAll('[data-cid]').forEach(n=>n.onclick=async()=>{if(done)return;await txGame(x=>{x.assignments[me.id]=n.dataset.cid;return x})});document.getElementById('done').onclick=async()=>txGame(x=>{x.assignmentDone[me.id]=true;if(Object.keys(x.assignmentDone).length===x.players.length)x.phase='round_result';return x})}
function renderRoundResult(s){const counts={};s.fieldCards.forEach(c=>counts[c.id]=0);Object.values(s.assignments).forEach(cid=>counts[cid]=(counts[cid]||0)+1);root.innerHTML=`<div class="card"><div class="phase">デート結果</div><h2>💞 誰と2人きりになった？</h2><div class="grid">${s.players.map(p=>{const c=s.fieldCards.find(x=>x.id===s.selected[p.id]);const n=counts[c.id]||0;const good=n===1;const mult=p.id===s.parent?2:1;return `<div class="notice"><b>${esc(p.name)}</b><br>${c.icon} ${esc(c.place)}<br>${n===1?'👩 女性1人・2人きり！':`👥 女性${n}人 → 2人きり失敗`}<br>${good?`<strong style="color:var(--gold)">${STAT[c.status].label} +${c.value*mult}</strong>`:'<span class="muted">獲得なし</span>'}</div>`}).join('')}</div><button class="btn primary block" id="next" style="margin-top:14px">次へ</button></div>`;document.getElementById('next').onclick=async()=>txGame(x=>{applyRoundResult(x);return x})}
function renderConfession(s){const sorted={};Object.keys(STAT).forEach(k=>sorted[k]=[...s.players].sort((a,b)=>b.stats[k]-a.stats[k]));const winners={};Object.keys(STAT).forEach(k=>{const top=sorted[k][0].stats[k];winners[k]=sorted[k].filter(p=>p.stats[k]===top).map(p=>p.id)});root.innerHTML=`<div class="card"><div class="phase">最終ラウンド</div><h1>👑 告白タイム</h1><p class="muted">ここで初めて、全員のステータスが公開されます。</p><div class="grid" style="margin-top:14px">${s.players.map(p=>`<div class="notice"><b>${esc(p.name)}</b>${statusOwn(p)}</div>`).join('')}</div></div><div class="card"><h2>💘 爆美女への告白</h2><div class="beauty">${BEAUTIES.map(b=>{const ws=winners[b.id].map(id=>s.players[id]);const winner=ws.length===1?ws[0]:null;return `<div class="card ${winner?'win':''}"><div style="font-size:34px">👸</div><h3>${b.name}</h3><p class="small muted">${b.desc}</p><div>${ws.map(p=>`<b>${esc(p.name)}</b>`).join('・')}</div>${winner?`<p style="color:var(--gold);font-weight:900">告白OK！＋1点</p>`:`<p class="small">同率のためタイブレークが必要</p>`}</div>`}).join('')}</div><button class="btn primary block" id="finish" style="margin-top:16px">最終結果を確定</button></div>`;document.getElementById('finish').onclick=async()=>txGame(x=>{for(const b of BEAUTIES){const vals=x.players.map(p=>p.stats[b.id]);const max=Math.max(...vals);const ids=x.players.map((p,i)=>vals[i]===max?i:-1).filter(i=>i>=0);let winner=ids[0];if(ids.length>1){const scores=ids.map(i=>{const h=x.players[i].history?.[b.id]||[];return [h.filter(v=>v===b.id).length,h.reduce((a,v)=>a+v,0)]});winner=ids.sort((a,c)=>{const A=x.players[a].tie?.[b.id]||0,C=x.players[c].tie?.[b.id]||0;return C-A})[0]}x.players[winner].score++;x.players[winner].beauties.push(b.id)}x.phase='gameover';return x})}
function renderGameover(s){const ranking=[...s.players].sort((a,b)=>b.score-a.score);root.innerHTML=`<div class="card center"><div class="big">🏆</div><h1>告白結果</h1><p class="muted">最も多くの爆美女を仕留めたのは……</p><div class="big" style="color:var(--gold)">${esc(ranking[0].name)}</div><p>${ranking[0].score}点</p></div><div class="card"><h2>最終ランキング</h2>${ranking.map((p,i)=>`<div class="notice" style="margin:8px 0"><div class="row" style="justify-content:space-between"><span class="rank">${i+1}位　${esc(p.name)}</span><b>${p.score}点</b></div><div class="small muted">${p.beauties.map(id=>BEAUTIES.find(b=>b.id===id)?.name||'').join(' / ')||'爆美女なし'}</div>${statusOwn(p)}</div>`).join('')}</div><button class="btn primary block" id="again">もう一度</button><button class="btn block" id="title" style="margin-top:8px">タイトルへ</button>`;document.getElementById('again').onclick=async()=>{await txGame(x=>{const names=x.players.map(p=>p.name);let n=initialState(names,x.totalRounds);n.phase='initial_setup';return n})};document.getElementById('title').onclick=()=>{disconnect();renderStart()}}
function renderOnline(){if(!App.doc){return}document.getElementById('connection').textContent=App.roomCode?'● ONLINE / '+App.roomCode:'';if(App.doc.status==='waiting')return renderLobby();const s=App.doc.game;if(!s)return; if(s.phase==='initial_setup')return renderInitial(s);if(s.phase==='parent_select'||s.phase==='child_select')return renderField(s);if(s.phase==='conversation')return renderConversation(s);if(s.phase==='assignment')return renderAssignment(s);if(s.phase==='round_result')return renderRoundResult(s);if(s.phase==='confession')return renderConfession(s);if(s.phase==='gameover')return renderGameover(s)}
function showError(msg){root.innerHTML=`<div class="card center"><h2>エラー</h2><p>${esc(msg)}</p><button class="btn" id="b">タイトルへ</button></div>`;document.getElementById('b').onclick=()=>{disconnect();renderStart()}}

// ============================================================
// 同じ端末用：オンラインと同じゲームエンジンを利用
// ============================================================
let localNames=[],localState=null;
function renderLocalSetup(){root.innerHTML=`<div class="card"><h2>同じ端末で遊ぶ</h2><p class="muted">2～6人。端末を順番に渡してプレイします。</p><label>人数</label><select id="num" style="width:100%;background:#0f1220;color:white;border:1px solid var(--line);padding:11px;border-radius:11px"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select><div id="names" style="margin-top:12px"></div><button class="btn primary block" id="go">開始</button><button class="btn block" id="back" style="margin-top:8px">戻る</button></div>`;const names=document.getElementById('names');function draw(){names.innerHTML='';for(let i=0;i<+document.getElementById('num').value;i++)names.innerHTML+=`<label>プレイヤー${i+1}<input id="ln${i}" value="プレイヤー${i+1}" maxlength="12"></label>`}document.getElementById('num').onchange=draw;draw();document.getElementById('back').onclick=renderStart;document.getElementById('go').onclick=()=>{localNames=Array.from({length:+document.getElementById('num').value},(_,i)=>document.getElementById('ln'+i).value||'プレイヤー'+(i+1));localState=initialState(localNames,8);localState.phase='initial_setup';App.localSeat=0;renderLocal()}}
function renderLocal(){const s=localState;if(s.phase==='initial_setup'){renderInitialLocal(s);return}if(s.phase==='parent_select'||s.phase==='child_select'){renderFieldLocal(s);return}if(s.phase==='conversation'){renderConversationLocal(s);return}if(s.phase==='assignment'){renderAssignmentLocal(s);return}if(s.phase==='round_result'){renderRoundResultLocal(s);return}if(s.phase==='confession'){renderConfessionLocal(s);return}if(s.phase==='gameover'){renderGameoverLocal(s)}}
function renderInitialLocal(s){const p=s.players[App.localSeat];root.innerHTML=`<div class="card center"><div class="phase">${esc(p.name)}の設定</div><h2>初期4ポイントを配分</h2><div id="alloc"></div><div class="notice">残り：<b id="remain"></b></div><button class="btn primary block" id="ok" style="margin-top:12px">確定</button></div>`;const box=document.getElementById('alloc');Object.entries(STAT).forEach(([k,v])=>box.innerHTML+=`<div class="row" style="justify-content:space-between;margin:9px 0"><b>${v.label}</b><div class="row"><button class="btn" data-m="${k}">−</button><b id="n-${k}" style="width:25px">${p.initialStats[k]}</b><button class="btn" data-p="${k}">＋</button></div></div>`);function draw(){const n=Object.values(p.initialStats).reduce((a,b)=>a+b,0);document.getElementById('remain').textContent=4-n;Object.keys(p.initialStats).forEach(k=>document.getElementById('n-'+k).textContent=p.initialStats[k]);document.getElementById('ok').disabled=n!==4}box.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const k=b.dataset.p,n=Object.values(p.initialStats).reduce((a,x)=>a+x,0);if(n<4){p.initialStats[k]++;draw()}});box.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const k=b.dataset.m;if(p.initialStats[k]>0){p.initialStats[k]--;draw()}});draw();document.getElementById('ok').onclick=()=>{p.stats={...p.initialStats};p.initialConfirmed=true;if(s.players.every(x=>x.initialConfirmed)){s.round=1;s.parent=0;s.fieldCards=makeCards();s.phase='parent_select'}else App.localSeat=(App.localSeat+1)%s.players.length;renderLocal()}}
function renderFieldLocal(s){const me=s.players[App.localSeat];const allowed=s.phase==='parent_select'?App.localSeat===s.parent:App.localSeat!==s.parent;const childTurn=s.phase==='child_select'?s.players.find(p=>p.id!==s.parent&&!s.selected[p.id])?.id:null;root.innerHTML=`<div class="card"><div class="phase">第${s.round}/${s.totalRounds}</div><h2>${esc(me.name)}の番</h2><p class="muted">${s.phase==='parent_select'?'親として1枚選んでください。':'子として残りから1枚選んでください。'}</p>${statusOwn(me)}</div><div class="card"><div class="cards">${s.fieldCards.map(c=>cardHtml(c,s.selected[me.id]===c.id,usedIds(s).includes(c.id)||!allowed||(s.phase==='child_select'&&childTurn!==me.id))).join('')}</div></div>`;root.querySelectorAll('[data-card]').forEach(n=>n.onclick=()=>{const cid=n.dataset.card;if(!allowed||usedIds(s).includes(cid))return;s.selected[me.id]=cid;if(s.phase==='parent_select')s.phase='child_select';else if(Object.keys(s.selected).length===s.players.length)s.phase='conversation';App.localSeat=(s.phase==='child_select'?s.players.find(p=>p.id!==s.parent&&!s.selected[p.id])?.id:0)??0;if(s.phase==='conversation')App.localSeat=0;renderLocal()})}
function renderConversationLocal(s){root.innerHTML=`<div class="card"><div class="phase">会話タイム</div><h2>💬 会話タイム</h2><p class="muted">全員で自由に会話。会話のタネを使って、女性がどこへ行くか決めてください。</p><div class="grid">${s.players.map(p=>{const c=s.fieldCards.find(x=>x.id===s.selected[p.id]);return `<div class="notice"><b>${esc(p.name)}</b><br>${c.icon}${esc(c.place)}<br>${STAT[c.status].label} +${c.value}<br>💬 ${esc(c.topic)}</div>`}).join('')}</div><button class="btn primary block" id="go">配置へ</button></div>`;document.getElementById('go').onclick=()=>{s.phase='assignment';s.assignments={};s.assignmentDone={};App.localSeat=0;renderLocal()}}
function renderAssignmentLocal(s){const p=s.players[App.localSeat];const cards=s.fieldCards.filter(c=>usedIds(s).includes(c.id));root.innerHTML=`<div class="card"><div class="phase">${esc(p.name)}：女性配置</div><h2>会話の結果、女性はどこへ？</h2><div class="cards">${cards.map(c=>`<div class="date ${s.assignments[p.id]===c.id?'selected':''}" data-c="${c.id}">${c.icon}<div class="name">${esc(c.place)}</div><span class="pill">${STAT[c.status].label} +${c.value}</span></div>`).join('')}</div><button class="btn primary block" id="ok" ${!s.assignments[p.id]?'disabled':''} style="margin-top:12px">確定</button></div>`;root.querySelectorAll('[data-c]').forEach(n=>n.onclick=()=>{s.assignments[p.id]=n.dataset.c;renderLocal()});document.getElementById('ok').onclick=()=>{s.assignmentDone[p.id]=true;if(Object.keys(s.assignmentDone).length===s.players.length)s.phase='round_result';else App.localSeat=(App.localSeat+1)%s.players.length;renderLocal()}}
function renderRoundResultLocal(s){const counts={};s.fieldCards.forEach(c=>counts[c.id]=0);Object.values(s.assignments).forEach(cid=>counts[cid]++);root.innerHTML=`<div class="card"><h2>💞 デート結果</h2><div class="grid">${s.players.map(p=>{const c=s.fieldCards.find(x=>x.id===s.selected[p.id]);const n=counts[c.id];const ok=n===1,m=p.id===s.parent?2:1;return `<div class="notice"><b>${esc(p.name)}</b><br>${c.icon}${esc(c.place)}<br>${ok?'2人きり！':'2人きり失敗'}<br>${ok?STAT[c.status].label+' +'+c.value*m:'獲得なし'}</div>`}).join('')}</div><button class="btn primary block" id="go">次へ</button></div>`;document.getElementById('go').onclick=()=>{applyRoundResult(s);App.localSeat=0;renderLocal()}}
function renderConfessionLocal(s){const winners={};Object.keys(STAT).forEach(k=>{const max=Math.max(...s.players.map(p=>p.stats[k]));winners[k]=s.players.filter(p=>p.stats[k]===max)});root.innerHTML=`<div class="card"><h1>👑 告白タイム</h1><p class="muted">全員のステータス公開！</p><div class="grid">${s.players.map(p=>`<div class="notice"><b>${esc(p.name)}</b>${statusOwn(p)}</div>`).join('')}</div></div><div class="card"><div class="beauty">${BEAUTIES.map(b=>`<div class="card"><div style="font-size:34px">👸</div><h3>${b.name}</h3><b>${winners[b.id].map(p=>esc(p.name)).join('・')}</b><p class="small">同率の場合は全員を表示し、実装上は先着順で1点</p></div>`).join('')}</div><button class="btn primary block" id="go" style="margin-top:14px">結果を見る</button></div>`;document.getElementById('go').onclick=()=>{Object.keys(STAT).forEach(k=>{const max=Math.max(...s.players.map(p=>p.stats[k]));const w=s.players.find(p=>p.stats[k]===max);w.score++;w.beauties.push(k)});s.phase='gameover';renderLocal()}}
function renderGameoverLocal(s){const ranking=[...s.players].sort((a,b)=>b.score-a.score);root.innerHTML=`<div class="card center"><div class="big">🏆</div><h1>${esc(ranking[0].name)}の勝利！</h1><p>${ranking[0].score}点</p></div><div class="card">${ranking.map((p,i)=>`<div class="notice" style="margin:8px 0"><b>${i+1}位 ${esc(p.name)}</b>　${p.score}点<br>${statusOwn(p)}</div>`).join('')}</div><button class="btn primary block" id="again">もう一度</button><button class="btn block" id="title" style="margin-top:8px">タイトル</button>`;document.getElementById('again').onclick=()=>{localState=initialState(localNames,8);App.localSeat=0;renderLocal()};document.getElementById('title').onclick=renderStart}
renderStart();
</script>
</body></html>
