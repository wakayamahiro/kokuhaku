<body>
<div id="app">
  <div class="title-row">

<script>
/* =====================================================================
   1. データ定義
   ===================================================================== */
const STATUS_IDS = ['affection','tension','expense','romantic'];
const STATUS_META = {
  affection:{label:'好感度', emoji:'💗', color:'var(--pink-deep)'},
  tension:{label:'緊張度', emoji:'😳', color:'var(--yellow)'},
  expense:{label:'出費', emoji:'💰', color:'var(--green)'},
  romantic:{label:'ロマンチック度', emoji:'🌙', color:'var(--purple)'},
};
const TIME_META = {
  day:{label:'昼', emoji:'☀️'},
  evening:{label:'夕方', emoji:'🌆'},
  night:{label:'夜', emoji:'🌙'},
};
const LOCATIONS = [
  {name:'カフェ', icon:'☕'}, {name:'映画館', icon:'🎬'}, {name:'遊園地', icon:'🎡'},
  {name:'水族館', icon:'🐠'}, {name:'展望台', icon:'🌃'}, {name:'高級レストラン', icon:'🍽️'},
  {name:'ショッピング', icon:'🛍️'}, {name:'公園', icon:'🌳'}, {name:'カラオケ', icon:'🎤'},
  {name:'美術館', icon:'🖼️'}, {name:'海', icon:'🌊'}, {name:'動物園', icon:'🦁'},
  {name:'ボウリング', icon:'🎳'}, {name:'ゲームセンター', icon:'🕹️'}, {name:'温泉', icon:'♨️'},
  {name:'神社', icon:'⛩️'}, {name:'プラネタリウム', icon:'🔭'}, {name:'ドライブ', icon:'🚗'},
  {name:'夜の街', icon:'🌆'}, {name:'ホテルラウンジ', icon:'🛋️'},
];
const TOPICS = ['好きな食べ物','好きな映画','音楽','旅行','動物','仕事','学校','趣味','休日','恋愛','子供の頃','最近ハマっていること','行ってみたい場所','好きな季節','理想のデート','秘密','苦手なこと','最近あった面白い話'];

let _idc = 0;
function nid(p){ return p+'_'+(_idc++); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function clone(s){ return JSON.parse(JSON.stringify(s)); }
function pushLog(s,m){ s.log.push(m); if(s.log.length>400) s.log.shift(); }

function buildLocationDeck(){
  const deck=[];
  LOCATIONS.forEach(loc=>{ for(let i=0;i<3;i++) deck.push({locName:loc.name, locIcon:loc.icon}); });
  return shuffle(deck);
}
function generateCard(loc){
  const status = STATUS_IDS[Math.floor(Math.random()*4)];
  const value = 1; // ステータス値は一律+1（親と2人きりなら2倍の+2）
  const times = Object.keys(TIME_META);
  const time = times[Math.floor(Math.random()*3)];
  const topic = TOPICS[Math.floor(Math.random()*TOPICS.length)];
  return {id:nid('card'), name:loc.locName, icon:loc.locIcon, status, value, time, topic};
}

/* =====================================================================
   2. ゲームエンジン（純関数）
   ===================================================================== */
const Game3 = {};
Game3.newGame = function(names, totalRounds){
  totalRounds = totalRounds || 8;
  const players = names.map((name,i)=>({
    id:i, name,
    stats:{affection:0,tension:0,expense:0,romantic:0},
    initialStats:null,
    history:{affection:[],tension:[],expense:[],romantic:[]},
    beautyGirls:[], score:0,
  }));
  return {
    players, currentRound:1, totalRounds,
    parentIndex: Math.floor(Math.random()*names.length), // 最初の仮ヒロインはランダム決定
    deck: buildLocationDeck(), discardPile:[],
    fieldCards: [], selections:{},
    pendingInitialStats:{},
    lastRoundResults: [],
    phase:'initial_stats',
    confession:null,
    log:['ゲーム開始：まずは初期ステータスを振り分けてください'],
  };
};
Game3.setInitialStats = function(stateIn, playerId, statsObj){
  const state = clone(stateIn);
  if(state.phase!=='initial_stats') return state;
  if(state.pendingInitialStats[playerId]) return state;
  const sum = STATUS_IDS.reduce((a,k)=>a+(statsObj[k]||0),0);
  if(sum!==4) return state;
  for(const k of STATUS_IDS){ if(!Number.isInteger(statsObj[k]) || statsObj[k]<0) return state; }
  state.players[playerId].stats = {...statsObj};
  state.players[playerId].initialStats = {...statsObj};
  state.pendingInitialStats[playerId] = true;
  pushLog(state, `${state.players[playerId].name} の初期ステータスが決定`);
  if(state.players.every(p=>state.pendingInitialStats[p.id])) return startRound(state);
  return state;
};
function drawFieldCards(state){
  const drawn=[];
  for(let i=0;i<5;i++){
    if(state.deck.length===0){
      if(state.discardPile.length===0) break;
      state.deck = shuffle(state.discardPile); state.discardPile=[];
      pushLog(state,'山札が尽きたため、捨て札をシャッフルして再利用します');
    }
    const loc = state.deck.pop();
    state.discardPile.push(loc);
    drawn.push(generateCard(loc));
  }
  return drawn;
}
function startRound(state){
  state.fieldCards = drawFieldCards(state);
  state.selections = {};
  state.phase = 'selecting';
  pushLog(state, `第${state.currentRound}ラウンド開始（仮ヒロイン: ${state.players[state.parentIndex].name}）`);
  return state;
}
Game3.selectLocation = function(stateIn, playerId, cardId){
  const state = clone(stateIn);
  if(state.phase!=='selecting') return state;
  if(state.selections[playerId]!==undefined) return state;
  const card = state.fieldCards.find(c=>c.id===cardId);
  if(!card) return state;
  state.selections[playerId] = cardId;
  if(Object.keys(state.selections).length === state.players.length) return revealAndScore(state);
  return state;
};
function revealAndScore(state){
  const parentIndex = state.parentIndex;
  const groups = {};
  Object.entries(state.selections).forEach(([pid,cid])=>{
    if(!groups[cid]) groups[cid]=[];
    groups[cid].push(+pid);
  });
  const results = [];
  Object.entries(groups).forEach(([cid, pids])=>{
    const card = state.fieldCards.find(c=>c.id===cid);
    const hasParent = pids.includes(parentIndex);
    let awardedTo = [];
    if(hasParent && pids.length===2){
      const child = pids.find(pid=>pid!==parentIndex);
      const awarded = card.value*2;
      state.players[child].stats[card.status] += awarded;
      state.players[child].history[card.status].push({round:state.currentRound, cardValue:card.value, viaParentMatch:true, awarded});
      awardedTo.push({playerId:child, awarded});
    } else if(!hasParent && pids.length===2){
      pids.forEach(pid=>{
        const awarded = card.value*1;
        state.players[pid].stats[card.status] += awarded;
        state.players[pid].history[card.status].push({round:state.currentRound, cardValue:card.value, viaParentMatch:false, awarded});
        awardedTo.push({playerId:pid, awarded});
      });
    }
    results.push({card, playerIds:pids, hasParent, success:awardedTo.length>0, awardedTo});
  });
  state.lastRoundResults = results;
  state.phase = 'results';
  pushLog(state, `第${state.currentRound}ラウンド結果確定`);
  return state;
}
Game3.nextRound = function(stateIn){
  const state = clone(stateIn);
  if(state.phase!=='results') return state;
  if(state.currentRound>=state.totalRounds) return computeConfession(state);
  state.currentRound += 1;
  state.parentIndex = (state.parentIndex+1) % state.players.length;
  return startRound(state);
};
function computeConfession(state){
  const results = {};
  STATUS_IDS.forEach(stat=>{
    const maxVal = Math.max(...state.players.map(p=>p.stats[stat]));
    let candidates = state.players.filter(p=>p.stats[stat]===maxVal);
    let reason = '唯一の最高値';
    if(candidates.length>1){
      const c1 = candidates.map(p=>({p, v:p.history[stat].length}));
      const m1 = Math.max(...c1.map(x=>x.v));
      candidates = c1.filter(x=>x.v===m1).map(x=>x.p);
      reason = `獲得回数(${m1}回)で優先`;
      if(candidates.length>1){
        const c2 = candidates.map(p=>({p, v:p.history[stat].filter(h=>h.cardValue>=2).length}));
        const m2 = Math.max(...c2.map(x=>x.v));
        candidates = c2.filter(x=>x.v===m2).map(x=>x.p);
        reason = `+2/+3カード獲得回数(${m2}回)で優先`;
        if(candidates.length>1){
          const c3 = candidates.map(p=>({p, v:p.history[stat].filter(h=>h.viaParentMatch).length}));
          const m3 = Math.max(...c3.map(x=>x.v));
          candidates = c3.filter(x=>x.v===m3).map(x=>x.p);
          reason = `仮ヒロインとの2倍成立回数(${m3}回)で優先`;
          if(candidates.length>1){ candidates=[candidates[Math.floor(Math.random()*candidates.length)]]; reason='ランダム決定'; }
        }
      }
    }
    results[stat] = {winnerId: candidates[0].id, value:maxVal, reason};
  });
  STATUS_IDS.forEach(stat=>{
    const winner = state.players.find(p=>p.id===results[stat].winnerId);
    winner.beautyGirls.push(stat);
    winner.score += 1;
  });
  state.confession = results;
  state.phase = 'final';
  pushLog(state, '告白タイム：最強のヒロインが決定しました');
  return state;
}

/* =====================================================================
   3. Firebase 初期化（オンライン対戦用）
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyCHiPbAERMR--X8C_jfu-S9ALETc0DmybU",
  authDomain: "sea-solt2.firebaseapp.com",
  projectId: "sea-solt2",
  storageBucket: "sea-solt2.firebasestorage.app",
  messagingSenderId: "267993560136",
  appId: "1:267993560136:web:c1f2a8d75a7b22baf6d47d",
  measurementId: "G-1MDDE3GN49"
};
let fbReady=false, db=null;
try{
  if(firebaseConfig.apiKey && firebaseConfig.apiKey!=="YOUR_API_KEY"){
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    fbReady = true;
  }
}catch(e){ console.error('Firebase init failed', e); }
const ROOM_COLLECTION = 'rooms'; // 他ゲームと同じ rooms コレクションを共用

/* =====================================================================
   4. アプリ状態・共通描画パーツ
   ===================================================================== */
const App = {
  myUid: 'u_' + Math.random().toString(36).slice(2,10),
  myName:'', roomCode:null, roomUnsub:null, roomDoc:null, mySeat:-1,
  initSel:null, womenSel:null,
};
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
const root = document.getElementById('root');
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderStart(){
  root.innerHTML='';
  if(!fbReady){
    root.appendChild(el(`<div class="card"><h2>エラー</h2><p class="small">Firebaseの設定が見つかりません。</p></div>`));
    return;
  }
  root.appendChild(el(`
    <div class="card">
      <h2>💘 ここで待ってる</h2>
      <p class="muted small">2〜6人（推奨3〜5人）。デート場所を選び、女性たちの心を掴んで最強のヒロインの告白を勝ち取ろう！</p>
      <label>あなたの名前</label>
      <input type="text" id="oname" value="あなた" maxlength="10" />
      <div class="section-label">ルームを作成する</div>
      <label>参加人数の上限</label>
      <div class="row" id="seat-pick"></div>
      <label style="margin-top:10px;">ラウンド数</label>
      <div class="row" id="round-pick"></div>
      <button class="btn primary block" id="create" style="margin-top:10px;">ルームを作成する</button>
      <div class="section-label">ルームに参加する</div>
      <div class="row">
        <input type="text" id="joincode" placeholder="ルームコード（例: A3F9K）" maxlength="8" style="text-transform:uppercase;" />
        <button class="btn primary small" id="join">参加する</button>
      </div>
      <div id="online-error" class="small" style="color:var(--pink-deep);font-weight:700;margin-top:8px;"></div>
      <div class="center" style="margin-top:10px;"><span class="help-toggle" id="toggle-rules">ルールを見る</span></div>
      <div id="rules-body" class="hidden"></div>
    </div>
  `));
  let maxSeats=4, totalRounds=8;
  const seatBox = document.getElementById('seat-pick');
  [2,3,4,5,6].forEach(n=>{
    const b = el(`<button class="btn small ${n===maxSeats?'selected':''}">${n}人</button>`);
    b.onclick=()=>{ maxSeats=n; [...seatBox.children].forEach(c=>c.classList.remove('selected')); b.classList.add('selected'); };
    seatBox.appendChild(b);
  });
  const roundBox = document.getElementById('round-pick');
  [6,8,10].forEach(n=>{
    const b = el(`<button class="btn small ${n===totalRounds?'selected':''}">${n}R</button>`);
    b.onclick=()=>{ totalRounds=n; [...roundBox.children].forEach(c=>c.classList.remove('selected')); b.classList.add('selected'); };
    roundBox.appendChild(b);
  });
  document.getElementById('toggle-rules').onclick=(e)=>{
    const b=document.getElementById('rules-body');
    if(b.classList.contains('hidden')){ b.classList.remove('hidden'); b.innerHTML=rulesHtml(); e.target.textContent='閉じる'; }
    else{ b.classList.add('hidden'); e.target.textContent='ルールを見る'; }
  };
  document.getElementById('create').onclick = async ()=>{
    App.myName = document.getElementById('oname').value.trim()||'あなた';
    setErr('');
    try{ await createRoom(maxSeats, totalRounds); }catch(e){ console.error(e); setErr('ルーム作成に失敗: '+e.message); }
  };
  document.getElementById('join').onclick = async ()=>{
    App.myName = document.getElementById('oname').value.trim()||'あなた';
    const code = document.getElementById('joincode').value.trim().toUpperCase();
    if(!code){ setErr('ルームコードを入力してください'); return; }
    setErr('');
    try{ await joinRoom(code); }catch(e){ console.error(e); setErr('参加に失敗: '+e.message); }
  };
}
function setErr(msg){ const n=document.getElementById('online-error'); if(n) n.textContent=msg; }
function rulesHtml(){
  return `
    <p>仮ヒロインが今回のラウンドの「狙われる側」になります。まず仮ヒロインがこっそりデート場所を1つ選び（他の人には分かりません）、続いて子羊たちも全員こっそり1つずつ選びます（子羊同士がかぶってもOK。誰が何を選んだかは分かりません）。</p>
    <p>全員が選び終えたら、選んだ場所が一斉に公開されます。仮ヒロインの場所にちょうど1人の子羊が重なっていたら、その子がカードのステータス値を<b>2倍</b>獲得。仮ヒロインのいない場所に子羊2人がちょうど重なっていたら、その2人が<b>1倍</b>ずつ獲得します（3人以上重なった場合や、誰もいない場合は報酬なしです）。</p>
    <p>他プレイヤーの現在ステータスは最終ラウンドまで非公開です。最終ラウンドで全員のステータスを公開し、4つのステータスそれぞれの1位が「最強のヒロイン」を獲得。獲得数が最多のプレイヤーが優勝です。</p>
  `;
}
function randomCode(){ const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<5;i++) s+=chars[Math.floor(Math.random()*chars.length)]; return s; }
async function createRoom(maxSeats, totalRounds){
  for(let attempt=0; attempt<5; attempt++){
    const code = randomCode();
    const ref = db.collection(ROOM_COLLECTION).doc(code);
    try{
      await db.runTransaction(async (tx)=>{
        const snap = await tx.get(ref);
        if(snap.exists) throw new Error('exists');
        const seats = Array.from({length:maxSeats}, ()=>null);
        seats[0] = {uid:App.myUid, name:App.myName};
        tx.set(ref, {
          status:'waiting', gameType:'confession',
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          maxSeats, totalRounds, seats, playingSeats:null, game:null,
        });
      });
      App.roomCode = code;
      subscribeRoom(code);
      return;
    }catch(e){ if(e.message==='exists') continue; throw e; }
  }
  throw new Error('コード発行に失敗しました。もう一度お試しください。');
}
async function joinRoom(code){
  const ref = db.collection(ROOM_COLLECTION).doc(code);
  await db.runTransaction(async (tx)=>{
    const snap = await tx.get(ref);
    if(!snap.exists) throw new Error('そのルームコードは見つかりません。');
    const data = snap.data();
    if(data.status!=='waiting') throw new Error('このルームはすでに開始しています。');
    const seats = data.seats.slice();
    const already = seats.findIndex(s=>s && s.uid===App.myUid);
    if(already<0){
      const idx = seats.findIndex(s=>s===null);
      if(idx<0) throw new Error('ルームは満席です。');
      seats[idx] = {uid:App.myUid, name:App.myName};
    }
    tx.update(ref, {seats});
  });
  App.roomCode = code;
  subscribeRoom(code);
}
function subscribeRoom(code){
  if(App.roomUnsub) App.roomUnsub();
  const ref = db.collection(ROOM_COLLECTION).doc(code);
  App.roomUnsub = ref.onSnapshot((snap)=>{
    if(!snap.exists){ renderErrorScreen('ルームが見つかりません。'); return; }
    App.roomDoc = snap.data();
    const seatsForLookup = App.roomDoc.playingSeats || App.roomDoc.seats;
    App.mySeat = seatsForLookup.findIndex(s=>s && s.uid===App.myUid);
    if(App.roomDoc.status==='waiting') renderLobby(code, ref);
    else renderGame(code, ref);
  }, (err)=>{ console.error(err); renderErrorScreen('通信エラー: '+err.message); });
}
function renderErrorScreen(msg){
  root.innerHTML='';
  root.appendChild(el(`<div class="card center"><h2>エラー</h2><p>${escapeHtml(msg)}</p><button class="btn block" id="back">タイトルへ</button></div>`));
  document.getElementById('back').onclick=()=>{ if(App.roomUnsub){App.roomUnsub();App.roomUnsub=null;} renderStart(); };
}
function renderLobby(code, ref){
  root.innerHTML='';
  const isHost = App.roomDoc.seats[0] && App.roomDoc.seats[0].uid===App.myUid;
  const filled = App.roomDoc.seats.filter(Boolean).length;
  const wrap = el(`<div class="card"></div>`);
  wrap.appendChild(el(`<h2>ルーム待機中</h2>`));
  wrap.appendChild(el(`<div class="room-code">${code}</div>`));
  wrap.appendChild(el(`<div class="center muted small" style="margin-bottom:10px;">このコードを他のプレイヤーに共有してください（2人以上で開始できます）</div>`));
  wrap.appendChild(el(`<div class="center small">ラウンド数: <b>${App.roomDoc.totalRounds}</b> ／ 定員: <b>${App.roomDoc.maxSeats}人</b></div>`));
  const list = el(`<div class="seat-list"></div>`);
  App.roomDoc.seats.forEach((s,i)=>{
    if(s) list.appendChild(el(`<div class="seat-item"><span>${escapeHtml(s.name)}${s.uid===App.myUid?'（あなた）':''}</span><span class="tag">席${i+1}</span></div>`));
    else list.appendChild(el(`<div class="seat-item empty"><span>空席</span><span class="tag">席${i+1}</span></div>`));
  });
  wrap.appendChild(list);
  if(isHost){
    const b = el(`<button class="btn primary block">ゲームを開始する（現在${filled}人）</button>`);
    b.disabled = filled<2;
    b.onclick = async ()=>{ try{ await startGame(ref); }catch(e){ console.error(e); addErr(wrap, e.message); } };
    wrap.appendChild(b);
  } else {
    wrap.appendChild(el(`<div class="muted small center">ホストの開始をお待ちください…（${filled}人参加中）</div>`));
  }
  const leave = el(`<button class="btn block">ルームを出る</button>`);
  leave.onclick = ()=>{ if(App.roomUnsub){App.roomUnsub();App.roomUnsub=null;} renderStart(); };
  wrap.appendChild(leave);
  root.appendChild(wrap);
}
function addErr(wrap, msg){ wrap.appendChild(el(`<div class="small" style="color:var(--pink-deep);font-weight:700;margin-top:8px;">${escapeHtml(msg)}</div>`)); }
async function startGame(ref){
  await db.runTransaction(async (tx)=>{
    const snap = await tx.get(ref);
    const data = snap.data();
    if(data.status!=='waiting') return;
    const activeSeats = data.seats.filter(Boolean);
    if(activeSeats.length<2) throw new Error('2人以上が必要です。');
    const names = activeSeats.map(s=>s.name);
    const state = Game3.newGame(names, data.totalRounds);
    tx.update(ref, {status:'playing', playingSeats:activeSeats, game:state});
  });
}
async function action(ref, fn){
  try{
    await db.runTransaction(async (tx)=>{
      const snap = await tx.get(ref);
      const data = snap.data();
      if(data.status!=='playing') return;
      const newState = fn(data.game);
      tx.update(ref, {game:newState});
    });
  }catch(e){ console.error('action failed', e); }
}
async function restartGame(ref, prevState){
  await db.runTransaction(async (tx)=>{
    const snap = await tx.get(ref);
    const data = snap.data();
    const names = prevState.players.map(p=>p.name);
    const state = Game3.newGame(names, data.totalRounds);
    tx.update(ref, {status:'playing', game:state});
  });
}

/* =====================================================================
   5. 共通UIパーツ
   ===================================================================== */
function statusBar(state){
  return el(`
    <div class="status">
      <div class="box"><div class="lbl">ラウンド</div><div class="val">${state.phase==='final'?'終了':state.currentRound+' / '+state.totalRounds}</div></div>
      <div class="box"><div class="lbl">仮ヒロイン</div><div class="val">${escapeHtml(state.players[state.parentIndex] ? state.players[state.parentIndex].name : '-')}</div></div>
      <div class="box"><div class="lbl">プレイヤー</div><div class="val">${state.players.length}人</div></div>
    </div>
  `);
}
function dateCardEl(card, opts){
  opts=opts||{};
  const meta = STATUS_META[card.status];
  const cls=['datecard']; if(opts.selected) cls.push('selected'); if(opts.taken) cls.push('taken');
  const node = el(`
    <div class="${cls.join(' ')}">
      <div class="icon">${card.icon}</div>
      <div class="name">${escapeHtml(card.name)}</div>
      <div class="stat-badge" style="background:${meta.color}">${meta.emoji} +${card.value}</div>
      <div class="time-badge">${TIME_META[card.time].emoji} ${TIME_META[card.time].label}</div>
      <div class="topic">💬 ${escapeHtml(card.topic)}</div>
    </div>
  `);
  if(opts.onClick && !opts.taken) node.addEventListener('click', ()=>opts.onClick(card.id));
  return node;
}
function myStatsPanel(player){
  const wrap = el(`<div class="card"></div>`);
  wrap.appendChild(el(`<div class="section-label">あなたのステータス（他の人には見えません）</div>`));
  const row = el(`<div class="row"></div>`);
  STATUS_IDS.forEach(k=>{
    row.appendChild(el(`<div class="pill on" style="background:${STATUS_META[k].color}">${STATUS_META[k].emoji} ${STATUS_META[k].label} ${player.stats[k]}</div>`));
  });
  wrap.appendChild(row);
  return wrap;
}

/* =====================================================================
   6. フェーズ別画面
   ===================================================================== */
function renderGame(code, ref){
  const state = App.roomDoc.game;
  const mySeat = App.mySeat;
  if(mySeat<0){ root.innerHTML=''; root.appendChild(el(`<div class="card center"><h2>観戦中</h2></div>`)); return; }
  if(state.phase==='initial_stats') return renderInitialStats(state, ref, mySeat);
  if(state.phase==='selecting') return renderSelecting(state, ref, mySeat);
  if(state.phase==='results') return renderResults(state, ref, mySeat);
  if(state.phase==='final') return renderFinal(state, ref, mySeat);
}
function renderInitialStats(state, ref, mySeat){
  const me = state.players[mySeat];
  if(state.pendingInitialStats[mySeat]){
    root.innerHTML='';
    const wrap = el(`<div class="card center"><h2>💗 初期ステータス設定</h2><p class="muted small">決定済みです。他のプレイヤーを待っています…</p></div>`);
    root.appendChild(wrap);
    return;
  }
  App.initSel = App.initSel || {affection:1,tension:1,expense:1,romantic:1};
  root.innerHTML='';
  const wrap = el(`<div class="card"><h2>💗 初期ステータス設定</h2><p class="muted small">合計4ポイントになるよう自由に振り分けてください。</p></div>`);
  const sum = STATUS_IDS.reduce((a,k)=>a+App.initSel[k],0);
  STATUS_IDS.forEach(k=>{
    const row = el(`
      <div class="stat-row">
        <span class="name">${STATUS_META[k].emoji} ${STATUS_META[k].label}</span>
        <div class="ctrl">
          <button class="roundbtn" data-act="minus">－</button>
          <span class="num">${App.initSel[k]}</span>
          <button class="roundbtn" data-act="plus">＋</button>
        </div>
      </div>
    `);
    row.querySelector('[data-act=minus]').onclick = ()=>{ if(App.initSel[k]>0){ App.initSel[k]--; renderInitialStats(state, ref, mySeat); } };
    row.querySelector('[data-act=plus]').onclick = ()=>{ if(sum<4){ App.initSel[k]++; renderInitialStats(state, ref, mySeat); } };
    row.querySelector('[data-act=minus]').disabled = App.initSel[k]<=0;
    row.querySelector('[data-act=plus]').disabled = sum>=4;
    wrap.appendChild(row);
  });
  wrap.appendChild(el(`<div class="center" style="margin:10px 0;font-weight:900;">残りポイント: ${4-sum}</div>`));
  const btn = el(`<button class="btn primary block">これで決定する</button>`);
  btn.disabled = sum!==4;
  btn.onclick = async ()=>{ const sel={...App.initSel}; await action(ref, s=>Game3.setInitialStats(s, mySeat, sel)); };
  wrap.appendChild(btn);
  root.appendChild(wrap);
}
function renderSelecting(state, ref, mySeat){
  root.innerHTML='';
  const wrap = el(`<div></div>`);
  wrap.appendChild(statusBar(state));
  const isParent = state.parentIndex===mySeat;
  const already = state.selections[mySeat]!==undefined;
  const doneCount = Object.keys(state.selections).length;
  const card = el(`<div class="card"></div>`);
  card.appendChild(el(`<h3>${isParent? '💌 あなたが今回の「仮ヒロイン」です！こっそりデート場所を選んでください' : '🙊 デート場所をこっそり選んでください（仮ヒロインが誰か以外は秘密です）'}</h3>`));
  card.appendChild(el(`<p class="small muted">選択済み: ${doneCount} / ${state.players.length}人（誰が何を選んだかは全員決定後に一斉公開されます）</p>`));
  if(already){
    card.appendChild(el(`<div class="center small muted" style="padding:20px 0;">選択済みです。他のプレイヤーを待っています…</div>`));
  } else {
    const cw = el(`<div class="card-wrap"></div>`);
    state.fieldCards.forEach(c=> cw.appendChild(dateCardEl(c, { onClick: (id)=> action(ref, s=>Game3.selectLocation(s, mySeat, id)) })));
    card.appendChild(cw);
  }
  wrap.appendChild(card);
  wrap.appendChild(myStatsPanel(state.players[mySeat]));
  root.appendChild(wrap);
}
function renderResults(state, ref, mySeat){
  root.innerHTML='';
  const wrap = el(`<div></div>`);
  wrap.appendChild(statusBar(state));
  const card = el(`<div class="card"></div>`);
  card.appendChild(el(`<h3>📋 第${state.currentRound}ラウンド結果公開</h3><p class="small muted">👑 = 今回の仮ヒロイン</p>`));
  state.lastRoundResults.forEach(r=>{
    const meta = STATUS_META[r.card.status];
    const names = r.playerIds.map(pid=> (pid===state.parentIndex?'👑 ':'')+escapeHtml(state.players[pid].name)).join('、');
    let outcome;
    if(r.success && r.hasParent) outcome = `💕 2人きり成功！（仮ヒロインと一致）${meta.emoji}${meta.label} +${r.awardedTo[0].awarded}`;
    else if(r.success && !r.hasParent) outcome = `💞 子羊同士で2人きり成立！${meta.emoji}${meta.label} 各+${r.awardedTo[0].awarded}`;
    else outcome = '不成立（報酬なし）';
    card.appendChild(el(`
      <div class="result-line ${r.success?'success':''}">
        <span class="icon">${r.card.icon}</span>
        <span><b>${escapeHtml(r.card.name)}</b>（${meta.emoji}${meta.label}+${r.card.value}）: ${names}<br>
        <span class="small">${outcome}</span></span>
      </div>
    `));
  });
  const btn = el(`<button class="btn primary block">${state.currentRound>=state.totalRounds?'告白タイムへ':'次のラウンドへ'}</button>`);
  btn.onclick = ()=> action(ref, s=>Game3.nextRound(s));
  card.appendChild(btn);
  wrap.appendChild(card);
  wrap.appendChild(myStatsPanel(state.players[mySeat]));
  root.appendChild(wrap);
}
function renderFinal(state, ref, mySeat){
  root.innerHTML='';
  const isHost = App.roomDoc.playingSeats[0] && App.roomDoc.playingSeats[0].uid===App.myUid;
  const wrap = el(`<div></div>`);
  wrap.appendChild(el(`<div class="card center"><h2>💋 告白タイム</h2><p class="muted small">全員のステータスが公開されました！</p></div>`));

  const statsCard = el(`<div class="card"></div>`);
  statsCard.appendChild(el(`<div class="section-label">最終ステータス</div>`));
  const table = el(`<table class="finaltable"><thead><tr><th>プレイヤー</th>${STATUS_IDS.map(k=>`<th>${STATUS_META[k].emoji}</th>`).join('')}</tr></thead><tbody></tbody></table>`);
  const tbody = table.querySelector('tbody');
  state.players.forEach(p=>{
    tbody.appendChild(el(`<tr><td>${escapeHtml(p.name)}</td>${STATUS_IDS.map(k=>`<td>${p.stats[k]}</td>`).join('')}</tr>`));
  });
  statsCard.appendChild(table);
  wrap.appendChild(statsCard);

  const beautyCard = el(`<div class="card"></div>`);
  beautyCard.appendChild(el(`<div class="section-label">最強のヒロインの告白結果</div>`));
  STATUS_IDS.forEach(stat=>{
    const res = state.confession[stat];
    const winner = state.players.find(p=>p.id===res.winnerId);
    const meta = STATUS_META[stat];
    beautyCard.appendChild(el(`
      <div class="beauty-card" style="background:${meta.color}">
        <div style="font-size:1.4rem;">${meta.emoji} ${meta.label}の最強のヒロイン</div>
        <div style="font-size:1.1rem;font-weight:900;margin-top:4px;">💋 ${escapeHtml(winner.name)} が告白成功！</div>
        <div class="small" style="opacity:.9;">(${meta.label} ${res.value} / ${res.reason})</div>
      </div>
    `));
  });
  wrap.appendChild(beautyCard);

  const rankCard = el(`<div class="card"></div>`);
  rankCard.appendChild(el(`<div class="section-label">最終順位</div>`));
  const sorted = state.players.slice().sort((a,b)=>b.score-a.score);
  sorted.forEach((p,i)=>{
    rankCard.appendChild(el(`
      <div class="result-line ${i===0?'success':''}">
        <span class="icon">${i===0?'🏆':(i+1)+'位'}</span>
        <span><b>${escapeHtml(p.name)}</b> - 最強のヒロイン${p.score}人 (${p.beautyGirls.map(s=>STATUS_META[s].emoji).join(' ')||'なし'})</span>
      </div>
    `));
  });
  wrap.appendChild(rankCard);

  if(isHost){
    const b = el(`<button class="btn primary block">もう一度（同じメンバーで）</button>`);
    b.onclick = async ()=>{ try{ await restartGame(ref, state); }catch(e){ console.error(e); } };
    wrap.appendChild(b);
  }
  const exitBtn = el(`<button class="btn block">タイトルへ戻る</button>`);
  exitBtn.onclick = ()=>{ if(App.roomUnsub){App.roomUnsub();App.roomUnsub=null;} renderStart(); };
  wrap.appendChild(exitBtn);
  root.appendChild(wrap);
}

/* =====================================================================
   7. 起動
   ===================================================================== */
renderStart();
</script>
</body>
